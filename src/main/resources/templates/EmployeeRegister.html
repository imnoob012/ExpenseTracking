<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1"> <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<title>社員登録</title>
<style>
    body {
        background-color: #f8f9fa; /* 薄いグレーの背景 */
    }
    .container {
        margin-top: 50px; /* ヘッダーからの上部余白を調整 */
        padding: 30px; /* コンテンツのパディング */
        background-color: #ffffff; /* 白い背景 */
        border-radius: 8px; /* 角を丸く */
        box-shadow: 0 0 15px rgba(0, 0, 0, 0.1); /* 軽い影 */
        max-width: 500px; /* フォームの幅を制限して見やすく */
    }
    h2 {
        margin-bottom: 25px; /* タイトルの下余白 */
        color: #343a40; /* ダークなテキスト色 */
        text-align: center; /* 中央揃え */
    }
    .form-label {
        font-weight: bold;
        margin-bottom: 0.5rem;
    }
    .form-control {
        margin-bottom: 1rem; /* 各入力フィールドの下に余白 */
    }
    .form-check {
        margin-bottom: 1rem; /* ラジオボタンの下に余白 */
    }
    .btn-primary {
        width: 100%; /* ボタンをコンテナの幅いっぱいに広げる */
        margin-top: 1.5rem; /* ボタンの上に余白 */
    }
    .text-danger {
        font-size: 0.875em; /* エラーメッセージを小さめに */
    }
</style>
</head>
<body>
	<div th:replace="fragments/header :: commonHeader"></div>
	
	<div class="container">
        <h2 class="mb-4">社員登録</h2>

        <form method="post" th:action="@{/Employee/EmployeeRegister}" th:object="${employee}">
            <div class="mb-3">
                <label for="name" class="form-label">名前</label>
                <input type="text" class="form-control" id="name" placeholder="氏名を入力してください" th:field="*{name}" />
                <span th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="text-danger"></span>
            </div>

            <div class="mb-3">
                <label for="mail" class="form-label">メールアドレス</label>
                <input type="text" class="form-control" id="mail" placeholder="メールアドレスを入力してください" th:field="*{mail}" />
                <span th:if="${#fields.hasErrors('mail')}" th:errors="*{mail}" class="text-danger"></span>
            </div>

            <div class="mb-3">
                <label for="password" class="form-label">パスワード</label>
                <input type="password" class="form-control" id="password" placeholder="パスワードを入力してください" th:field="*{password}" />
                <span th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="text-danger"></span>
            </div>

            <div class="mb-3">
                <label class="form-label d-block">役割</label>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="role" id="role1" value="1" th:field="*{role}" />
                    <label class="form-check-label" for="role1">一般</label>
                </div>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="role" id="role2" value="2" th:field="*{role}" />
                    <label class="form-check-label" for="role2">管理者</label>
                </div>
                <span th:if="${#fields.hasErrors('role')}" th:errors="*{role}" class="text-danger d-block"></span>
            </div>

            <div>
                <button type="submit" class="btn btn-primary">登録</button>
            </div>
        </form>
	</div>
	
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
