<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<title>交通費詳細画面</title>
</head>
<body>
	<div th:replace="fragments/header :: commonHeader"></div>
	<form method="post" th:action="@{/ExpenseTracking/{trafficId}/detail/process(trafficId=${expenseTrackingForm.trafficId})}" th:object="${expenseTrackingForm}">
		<div>
			<label for="userDay">利用日</label>
			<input type="text" th:field="*{userDay}"/>
			<span th:if="${#fields.hasErrors('userDay')}" th:errors="*{userDay}" style="color: red;"></span>
		</div>
		<div>
			<label for="means">利用機関</label>
			<input type="text" th:field="*{means}" />
			<span th:if="${#fields.hasErrors('means')}" th:errors="*{means}" style="color: red;"></span>
		</div>
		<div>
			<label for="sector">利用区間</label>
			<input type="text" th:field="*{sector}" />
			<span th:if="${#fields.hasErrors('sector')}" th:errors="*{sector}" style="color: red;"></span>
		</div>
		<div>
			<!--javascriptでチェックがつけれる（後回し）-->
			<label for="road1">片道</label>
			<input type="radio"  name="road" value="1" id="road1"/>
			<label for="road2">往復</label>
			<input type="radio"  name="road" value="2" id="road2"/>
			<span th:if="${#fields.hasErrors('road')}" th:errors="*{road}" style="color: red;"></span>
		</div>
		<div>
			<label for="cost">利用料金</label>
			<input type="text" th:field="*{cost}" />
			<span th:if="${#fields.hasErrors('cost')}" th:errors="*{cost}" style="color: red;"></span>
		</div>
		
		<button type="submit" name="action" value="update">更新</button>
		<button type="submit" name="action" value="delete">削除</button>
	</form>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
