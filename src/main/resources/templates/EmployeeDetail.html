<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<title>社員詳細画面</title>
</head>
<body>
	<div th:replace="fragments/header :: commonHeader"></div>
	<form method="post" th:action="@{/Employee/{id}/detail/process(id=${employeeForm.id})}" th:object="${employeeForm}">
		<input type="hidden" th:field="*{id}" /> <!--id情報は更新機能のSQL文を発行する際に使用したいから-->
		<input type="hidden" th:field="*{password}"/>
		<div>
			<label for="name">名前</label>
			<input type="text" id="name" th:field="*{name}"/>
			<span th:if="${#fields.hasErrors('name')}" th:errors="*{name}" style="color: red;"></span>
		</div>
		<div>
			<label for="mail">メールアドレス</label>
			<input type="text" id="mail" th:field="*{mail}" />
			<span th:if="${#fields.hasErrors('mail')}" th:errors="*{mail}" style="color: red;"></span>
		</div>
		<div>
			<!--javascriptでチェックがつけれる（後回し）-->
			<label for="role1">一般：</label>
			<input type="radio"  name="role" value="1"id="role1"/>
			<label for="role2">管理者：</label>
			<input type="radio"  name="role" value="2" id="role2"/>
			<span th:if="${#fields.hasErrors('role')}" th:errors="*{role}" style="color: red;"></span>
		</div>
		
		<button type="submit" name="action" value="update">更新</button>
		<button type="submit" name="action" value="delete">削除</button>
		<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
	</form>
</body>
</html>
