<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<title>社員詳細画面</title>
<style>
    /* カスタムスタイル：間隔と配置を改善 */
    body {
        background-color: #f8f9fa;
    }
    .container {
        max-width: 600px;
        margin-top: 50px;
        padding: 30px;
        background-color: #ffffff;
        border-radius: 8px;
        box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
    }
    .form-label {
        font-weight: bold;
    }
    .form-control:focus {
        border-color: #80bdff;
        box-shadow: 0 0 0 0.25rem rgba(0, 123, 255, 0.25);
    }
    .btn-group {
        margin-top: 20px;
    }
</style>
</head>
<body>
    <div th:replace="fragments/header :: commonHeader"></div>
    <div class="container">
        <h2 class="mb-4 text-center">社員詳細</h2>
        <form method="post" th:action="@{/Employee/{id}/detail/process(id=${employeeForm.id})}" th:object="${employeeForm}">
            <input type="hidden" th:field="*{id}" />
            <input type="hidden" th:field="*{password}"/>

            <div class="mb-3">
                <label for="name" class="form-label">名前</label>
                <input type="text" id="name" th:field="*{name}" class="form-control" />
                <span th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="text-danger"></span>
            </div>

            <div class="mb-3">
                <label for="mail" class="form-label">メールアドレス</label>
                <input type="text" id="mail" th:field="*{mail}" class="form-control" />
                <span th:if="${#fields.hasErrors('mail')}" th:errors="*{mail}" class="text-danger"></span>
            </div>

            <div class="mb-3">
                <label class="form-label d-block">役割</label>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="role" value="1" id="role1" th:field="*{role}"/>
                    <label class="form-check-label" for="role1">一般</label>
                </div>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="role" value="2" id="role2" th:field="*{role}"/>
                    <label class="form-check-label" for="role2">管理者</label>
                </div>
                <span th:if="${#fields.hasErrors('role')}" th:errors="*{role}" class="text-danger d-block"></span>
            </div>
            
            <div class="d-grid gap-2 d-md-flex justify-content-md-end mt-4">
                <button type="submit" name="action" value="update" class="btn btn-primary me-md-2">更新</button>
                <button type="submit" name="action" value="delete" class="btn btn-danger">削除</button>
            </div>
        </form>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
