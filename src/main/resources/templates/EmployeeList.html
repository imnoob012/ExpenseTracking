<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<title>社員一覧画面</title>
<style>
    body {
        background-color: #f8f9fa;
    }
    .container {
        margin-top: 30px;
        padding: 20px;
        background-color: #ffffff;
        border-radius: 8px;
        box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
    }
    h2 {
        margin-bottom: 25px;
    }
</style>
</head>
<body>
	<div th:replace="fragments/header :: commonHeader"></div>
	<div class="container">
        <h2 class="text-center">社員一覧</h2>
		<div th:if="${Registration == 'success'}" class="alert alert-success alert-dismissible fade show" role="alert">
			登録成功しました！
			<button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
		</div>
		
		<table class="table table-striped table-hover table-bordered mt-4">
			<thead class="table-dark">
				<tr>
					<th>名前</th>
					<th>メールアドレス</th>
					<th>削除済み</th>
					<th>操作</th>
				</tr>
			</thead>
			<tbody>
				<tr th:each="employee : ${employeeDtoList}">
					<td th:text="${employee.name}"></td>
					<td th:text="${employee.mail}"></td>
					<td>
						<span th:if="${employee.deleteDate == null}" class="badge bg-success">未</span>
						<span th:unless="${employee.deleteDate == null}" class="badge bg-secondary">済</span>
					</td>
					<td>
						<a th:href="@{/Employee/{id}/detail(id=${employee.id})}" class="btn btn-info btn-sm">編集</a>
					</td>
				</tr>
			</tbody>
		</table>
	</div>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
