<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    </head>
<body>
	<div th:fragment="commonHeader">
		<nav class="navbar navbar-dark bg-dark">
		  <div class="container-fluid">
		    <a class="navbar-brand text-white" href="/">交通費申請書</a>
			
			<div class="d-flex gap-3">
			
			<form th:if="${currentPage == 'EmployeeList'}" sec:authorize="hasRole('ROLE_ADMIN')" th:action="@{/Employee/EmployeeRegister}" method="get">
				<input type="submit" value="社員登録" class="btn btn-outline-light"/>
				<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
			</form>
			
			<form th:if="${currentPage == 'EmployeeRegister' || currentPage == 'EmployeeDetail'}" sec:authorize="hasRole('ROLE_ADMIN')" th:action="@{/Employee/EmployeeList}" method="get">
				<input type="submit" value="社員一覧" class="btn btn-outline-light"/>
				<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
			</form>
			
			<form sec:authorize="hasAnyRole('ROLE_USER', 'ROLE_ADMIN')" th:action="@{/logout}" method="post">
				<input type="submit" value="ログアウト" class="btn btn-outline-light"/>
				<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
			</form>
			
			</div>
			
			
		  </div>
		</nav>
	 </div>
</body>
</html>
