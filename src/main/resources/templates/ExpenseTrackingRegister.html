<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1"> <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<title>交通費登録画面</title>
<style>
    body {
        background-color: #f8f9fa; /* 薄いグレーの背景 */
    }
    .container {
        margin-top: 50px; /* ヘッダーからの上部余白を調整 */
        padding: 30px; /* コンテンツのパディング */
        background-color: #ffffff; /* 白い背景 */
        border-radius: 8px; /* 角を丸く */
        box-shadow: 0 0 15px rgba(0, 0, 0, 0.1); /* 軽い影 */
        max-width: 600px; /* フォームの幅を制限して見やすく */
    }
    h2 {
        margin-bottom: 25px; /* タイトルの下余白 */
        color: #343a40; /* ダークなテキスト色 */
        text-align: center; /* 中央揃え */
    }
    .form-label {
        font-weight: bold;
        margin-bottom: 0.5rem;
    }
    .form-control {
        margin-bottom: 1rem; /* 各入力フィールドの下に余白 */
    }
    .form-check {
        margin-bottom: 1rem; /* ラジオボタンの下に余白 */
    }
    .btn-primary {
        width: 100%; /* ボタンをコンテナの幅いっぱいに広げる */
        margin-top: 1.5rem; /* ボタンの上に余白 */
    }
    .text-danger {
        font-size: 0.875em; /* エラーメッセージを小さめに */
    }
</style>
</head>
<body>
	<div th:replace="fragments/header :: commonHeader"></div>
	
	<div class="container">
        <h2 class="mb-4">交通費登録</h2>

        <form method="post" th:action="@{/ExpenseTracking/ExpenseTrackingRegister}" th:object="${expenseTrackingForm}">
            <div class="mb-3">
                <label for="userDay" class="form-label">利用日</label>
                <input type="text" class="form-control" id="userDay" placeholder="yyyy-mm-dd" th:field="*{userDay}"/>
                <span th:if="${#fields.hasErrors('userDay')}" th:errors="*{userDay}" class="text-danger"></span>			
            </div>

            <div class="mb-3">
                <label for="means" class="form-label">利用機関</label>
                <input type="text" class="form-control" id="means" placeholder="例: JR, 東京メトロ" th:field="*{means}"/>
                <span th:if="${#fields.hasErrors('means')}" th:errors="*{means}" class="text-danger"></span>			
            </div>

            <div class="mb-3">
                <label for="sector" class="form-label">利用区間</label>
                <input type="text" class="form-control" id="sector" placeholder="例: 新宿 - 東京" th:field="*{sector}"/>
                <span th:if="${#fields.hasErrors('sector')}" th:errors="*{sector}" class="text-danger"></span>
            </div>

            <div class="mb-3">
                <label class="form-label d-block">往復片道</label>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" value="1" id="road1" th:field="*{road}"/>
                    <label class="form-check-label" for="road1">片道</label>
                </div>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" value="2" id="road2" th:field="*{road}"/>
                    <label class="form-check-label" for="road2">往復</label>
                </div>
                <span th:if="${#fields.hasErrors('road')}" th:errors="*{road}" class="text-danger d-block"></span>			
            </div>

            <div class="mb-3">
                <label for="cost" class="form-label">費用</label>
                <input type="number" class="form-control" id="cost" placeholder="例: 240" th:field="*{cost}"/>
                <span th:if="${#fields.hasErrors('cost')}" th:errors="*{cost}" class="text-danger"></span>			
            </div>

            <div>
                <button type="submit" class="btn btn-primary">登録</button>
            </div>
        </form>
	</div>
	
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
