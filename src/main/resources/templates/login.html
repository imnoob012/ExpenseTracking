<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1"> <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<title>ログイン画面</title>
<style>
    body {
        background-color: #f8f9fa; /* 薄いグレーの背景 */
        display: flex; /* Flexboxを使ってコンテンツを中央に配置 */
        flex-direction: column; /* 縦方向に配置 */
        min-height: 100vh; /* 画面全体の高さを確保 */
    }
    .main-content {
        flex-grow: 1; /* コンテンツが中央に広がるように */
        display: flex;
        align-items: center; /* 垂直方向の中央揃え */
        justify-content: center; /* 水平方向の中央揃え */
    }
    .container {
        padding: 30px; /* コンテンツのパディング */
        background-color: #ffffff; /* 白い背景 */
        border-radius: 8px; /* 角を丸く */
        box-shadow: 0 0 15px rgba(0, 0, 0, 0.1); /* 軽い影 */
        max-width: 400px; /* フォームの幅を制限して見やすく */
        width: 100%; /* レスポンシブ対応 */
    }
    h2 {
        margin-bottom: 25px; /* タイトルの下余白 */
        color: #343a40; /* ダークなテキスト色 */
        text-align: center; /* 中央揃え */
    }
    .form-label {
        font-weight: bold;
        margin-bottom: 0.5rem;
    }
    .form-control {
        margin-bottom: 1rem; /* 各入力フィールドの下に余白 */
    }
    .btn-primary {
        width: 100%; /* ボタンをコンテナの幅いっぱいに広げる */
        margin-top: 1.5rem; /* ボタンの上に余白 */
    }
    .alert-danger { /* エラーメッセージのBootstrapスタイル */
        margin-bottom: 1.5rem;
        text-align: center;
    }
</style>
</head>
<body>
	<div th:replace="fragments/header :: commonHeader"></div>
	
    <div class="main-content">
        <div class="container">
            <h2 class="mb-4">ログイン</h2>

            <div th:if="${loginError}" class="alert alert-danger" role="alert">
                <p th:text="${loginError}"></p>
            </div>

            <form method="post" th:action="@{/login}">
                <div class="mb-3">
                    <label for="mail" class="form-label">メールアドレス</label>
                    <input type="email" class="form-control" id="mail" name="mail" placeholder="メールアドレスを入力してください" required />
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">パスワード</label>
                    <input type="password" class="form-control" id="password" name="password" placeholder="パスワードを入力してください" required />
                </div>

                <div>
                    <button type="submit" class="btn btn-primary">ログイン</button>
                </div>
            </form>
        </div>
    </div>
	
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
